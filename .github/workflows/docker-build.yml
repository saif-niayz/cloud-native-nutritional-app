name: Build docker image

on:
  push:
    brancher: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: set up docker buildx
      uses: docker/setup-buildx-action@v3

    -name: Build docker image
      run: docker build -t diet-analysis .